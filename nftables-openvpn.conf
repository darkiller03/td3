#!/usr/sbin/nft -f
# TD3 - Pare-feu machine "OpenVPN"  ->  copier dans /etc/nftables.conf
define LAN_WG = "ens19"

table inet filtre
delete table inet filtre

table inet filtre {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    # le client arrive masqueradé derrière la machine WireGuard (10.0.2.1)
    iifname $LAN_WG ip saddr 10.0.2.1 udp dport 1194 accept
    iifname "tun0" icmp type echo-request accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
