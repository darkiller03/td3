#!/usr/sbin/nft -f
# TD3 - Pare-feu machine "cliente"  ->  copier dans /etc/nftables.conf
# On ne fait PAS "flush ruleset" pour ne pas effacer les tables créées par wg-quick.
table inet filtre
delete table inet filtre

table inet filtre {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept   # réponses aux connexions sortantes
    ct state invalid drop
    iif "lo" accept
    iifname { "wg0", "tun0" } icmp type echo-request accept   # ping depuis les serveurs VPN
  }
  chain forward {
    type filter hook forward priority filter; policy drop;   # le client ne route rien
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
