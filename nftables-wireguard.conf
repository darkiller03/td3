#!/usr/sbin/nft -f
# TD3 - Pare-feu machine "WireGuard"  ->  copier dans /etc/nftables.conf
# Adapter le nom de l'interface vers le LAN "cliente" (voir : ip -br a)
define LAN_CLIENT = "ens19"
define LAN_OVPN   = "ens20"

table inet filtre
delete table inet filtre

table inet filtre {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    iifname $LAN_CLIENT ip saddr 10.0.1.0/24 udp dport 51820 accept   # tunnel WireGuard
    iifname "wg0" icmp type echo-request accept                       # ping depuis le client VPN
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept
    # seul flux routé : client WireGuard -> serveur OpenVPN (UDP 1194)
    iifname "wg0" oifname $LAN_OVPN ip daddr 10.0.2.2 udp dport 1194 accept
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
